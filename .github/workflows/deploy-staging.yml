name: Deploy Backend to Staging

on:
  push:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # set -e: kalau ada 1 baris gagal (misal git pull ketolak), script langsung
          # berhenti & step ini dilaporkan GAGAL (merah) - sebelumnya gak ada ini, jadi
          # git pull yang gagal cuma numpang lewat, lanjut ke npm install & pm2 restart
          # pakai kode LAMA yang masih ada, dan Actions tetap dilaporkan sukses (hijau)
          # padahal kode barunya gak pernah beneran nyampe ke server.
          script: |
            set -e
            cd ~/apps/backend-staging
            git checkout -- .
            git pull origin develop
            npm ci --omit=dev
            pm2 restart cv-anugrah-backend-staging
