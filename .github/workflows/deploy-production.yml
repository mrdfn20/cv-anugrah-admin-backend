name: Deploy Backend to Production

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # set -e + npm ci (bukan npm install) - lihat catatan di deploy-staging.yml.
          # npm install kadang "usil" dikit ngubah package-lock.json pas diinstall,
          # bikin git pull DEPLOY BERIKUTNYA ketolak ("local changes would be
          # overwritten") - gagalnya diam-diam karena gak ada set -e, jadi Actions
          # tetap kelihatan sukses padahal kode barunya gak pernah beneran nyampe.
          # npm ci gak pernah nulis ulang lockfile, jadi masalah ini gak kejadian lagi.
          script: |
            set -e
            cd ~/apps/backend
            git checkout -- .
            git pull origin main
            npm ci --omit=dev
            pm2 restart cv-anugrah-backend
